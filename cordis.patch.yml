# dsh-jev-tools bundle layer: Jev as a judgment primitive inside DeepSeek Harness.
#
# Mounts one host plugin. It contributes:
#   1. semantic pruning of oversized tool results (tools/post-execute)
#   2. screening of fetched pages for injected instructions (web_fetch / web_search)
#   3. skill suggestion when the skill catalog is large (agent/pre-step, advisory only)
#   4. the jev_ask and jev_gate tools
#   5. a judgment ledger persisted through the storage domain
#
# Requires TYPESAFE_API_KEY (environment variable or the settings card).
# With no key configured the plugin still mounts, every capability stays
# completely inert, and no network request is made.
#
# Privacy: once a key is configured, tool-result and fetched-page content is sent
# to the configured System One endpoint (api.typesafe.ai unless `baseUrl` names a
# self-hosted or gateway deployment) for judging. Every capability can be turned
# off separately in Settings -> Plugins -> dsh-jev-tools, and disabling takes
# effect immediately.
#
# The row id is the package name on purpose. DSH addresses a bundle's settings
# namespace by its **mount row id** — `SettingsForms.describe()` publishes
# `entry.options.id`, and a write resolves the same way — while this bundle's own
# card (the occupant of `plugins.bundle.config`) and the plugin page's config seat
# are keyed by the **package name**. Mounted as `jev-tools` the two disagree, and
# the card reads no namespace at all: every toggle stays disabled and the endpoint
# fields stay blank, with no error printed anywhere. Keep the row id and the
# package name equal — `test/bundle-contract.test.ts` enforces it.
- insert:
    - id: dsh-jev-tools
      name: dsh-jev-tools

name: release

# Releasing is two steps, and the second one is a human.
#
#   1. `git tag vX.Y.Z && git push origin vX.Y.Z` — this workflow runs the same
#      gates CI runs, then **stages** the package with `npm stage publish`.
#      Nothing is public yet.
#   2. A maintainer approves the staged version with 2FA — `npm stage approve
#      <stage-id>`, or the Staged Packages tab on npmjs.com — and then publishes
#      the draft Release this workflow left behind:
#          gh release edit vX.Y.Z --draft=false
#      Both commands are printed in the run summary, so the run itself says what
#      is left to do.
#
# Why it is two steps: the trusted publisher is configured **stage-only** —
# `npm publish` is not among its allowed actions — so a compromised workflow
# cannot put a package in front of the world on its own. The tag says "this is a
# release candidate"; the 2FA prompt is what says "and this is a release".
#
# A tag is what triggers a real release. There is one manual path, and it exists only
# because a version that reached the registry outside this workflow cannot be taken
# back: `workflow_dispatch` with a required `acknowledge_unprovenanced` boolean, which
# lets a maintainer say by hand that they know the version they tagged is unattested.
# It defaults to false, and a tag push can never satisfy it (`inputs` is empty there),
# so the strict path stays strict. The version check below still applies to a manual
# run — which is why a manual run must be dispatched **on the tag**, not on the
# default branch: `github.ref_name` is whatever ref you pick, and a branch name would
# fail the tag/manifest comparison before the acknowledgement is ever consulted.
#
# ## One-time setup, on the npm side
#
# Package settings -> Trusted publishing -> Add trusted publisher -> GitHub Actions:
#
#   organization or user : HorusJiang
#   repository           : dsh-jev-tools
#   workflow filename    : release.yml     (filename only, no path)
#   environment          : (leave empty)
#   allowed actions      : leave `npm publish` UNCHECKED — staged publishing only
#
# Two more prerequisites from npm's own docs: the package must already exist on
# the registry, and **2FA must be enabled on the account** — approval, by CLI or
# on the website, is a proof-of-presence step and cannot be done without it.
#
# A connection's provider and required fields cannot be edited after it is
# created, so a wrong value means deleting the connection and adding it again.
on:
  push:
    tags: ['v*']
  # The only manual path, and it requires typing out the acknowledgement: a
  # version that reached the registry without provenance cannot be taken back,
  # so continuing past that check has to be a decision somebody made on purpose.
  workflow_dispatch:
    inputs:
      acknowledge_unprovenanced:
        description: 'Stage even though this version is already public without provenance (irreversible)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a staging grant

jobs:
  stage:
    name: stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build

      # Pinned to the oldest npm that can do both jobs, inside the major this
      # runner's Node supports — deliberately not `@latest`:
      #
      #   >= 11.5.1   trusted publishing (OIDC)
      #   >= 11.15.0  staged publishing (`npm stage publish`)
      #
      # `@latest` is not merely unnecessary here, it is wrong, and 0.1.7's run
      # measured how: it installs npm 12, whose engines are
      # `^22.22.2 || ^24.15.0 || >=26.0.0`, while the runner's node 24 is older
      # than 24.15. npm then warns EBADENGINE and runs on a Node it does not
      # support — a release path that depends on that is a release path that
      # breaks on someone else's schedule.
      - name: Ensure npm can stage and use trusted publishing
        run: npm install --global 'npm@^11.15.0'

      # The tag and the manifest must agree before anything is uploaded, because
      # the publish itself takes the version from package.json and ignores the tag.
      - name: The tag and the manifest must agree
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag = ${GITHUB_REF_NAME}, package.json = ${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Install
        run: npm ci

      # The same gates CI runs on main, so only something those gates already
      # passed can be staged.
      - name: Build and test
        run: npm test

      - name: The tarball carries nothing local
        run: node scripts/check-tarball.mjs

      # A version being on the registry does NOT mean this pipeline put it there.
      # A local `npm publish` satisfies `npm view` exactly as a staged release does,
      # so the old check ("is it published? then we must have staged it") could only
      # ever wave a bypass through, and did: 0.1.13 and 0.7.3 shipped with no
      # provenance and a green run. Ask the question that actually distinguishes the
      # two paths instead — is the version *attested*? Provenance exists only for a
      # release that came through this workflow, so its absence is the truthful
      # signal that something published outside the gate.
      #
      # `already` is what npm forces on us (it refuses a second staging of a
      # published version); `unprovenanced` is what we refuse to pass off as fine.
      - name: Is this version already public, and was it attested?
        id: published
        shell: bash
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"

          attest() {
            curl -sf -o /dev/null \
              "https://registry.npmjs.org/-/npm/v1/attestations/dsh-jev-tools@${v}"
          }

          if ! npm view "dsh-jev-tools@${v}" version >/dev/null 2>&1; then
            echo "unprovenanced=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-jev-tools@${v} is not on the registry yet; nothing to compare against"
            exit 0
          fi

          echo "already=true" >> "$GITHUB_OUTPUT"
          if attest; then
            echo "unprovenanced=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-jev-tools@${v} is public and carries provenance; nothing to stage"
          else
            echo "unprovenanced=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=dsh-jev-tools@${v} is public WITHOUT provenance::This version did not come through this workflow."
          fi

      # npm refuses a second staging, so the gate *is* the red run: the only fix for
      # a version that is already public is a version that is not. Fail unless the
      # person running this said, by hand, that they know the version is unprovenanced.
      - name: Refuse to pass an unattested release off as a normal one
        if: steps.published.outputs.unprovenanced == 'true' && inputs.acknowledge_unprovenanced != true
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          {
            echo "::error title=dsh-jev-tools@${v} is public without provenance::It did not come through this workflow, and npm will not let a published version be staged again."
            echo "### \`dsh-jev-tools@${v}\` is public, and unattested"
            echo
            echo "This is the case the gate exists to catch: a version reached the registry"
            echo "without passing through \`npm stage publish\`, so it has no provenance and"
            echo "no 2FA approval behind it."
            echo
            echo "It cannot be repaired - npm refuses a second staging of a published version."
            echo "Going forward:"
            echo
            echo "\`\`\`bash"
            echo "# confirm the registry really has no attestation for it (404 = none)"
            echo "curl -s -o /dev/null -w '%{http_code}\n' \"
            echo "  https://registry.npmjs.org/-/npm/v1/attestations/dsh-jev-tools@${v}"
            echo "\`\`\`"
            echo
            echo "- If this tag is the release: bump to the next patch, re-tag, and let this"
            echo "  workflow stage it. Versions from here on will carry provenance."
            echo "- If the tag only records an already-public version and you want the run to"
            echo "  stop failing: Actions -> release -> Run workflow, set **Use workflow from**"
            echo "  to this tag (not the default branch - the tag/manifest check runs first),"
            echo "  and tick \`acknowledge_unprovenanced\`."
            echo
            echo "Either way **no draft Release was created by this run**: the job that creates"
            echo "it needs this one, so a red run here skips it. Create the Release by hand if"
            echo "you still want one (the changelog section for this version is the body)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # No token and no `--provenance` flag: npm takes the OIDC identity for the
      # grant and attaches provenance itself for a public package. Note that
      # staging does *not* need 2FA — only approving the staged package does.
      - name: Stage on npm
        if: steps.published.outputs.already != 'true'
        run: npm stage publish

      - name: What is left to do
        if: steps.published.outputs.already != 'true'
        shell: bash
        run: |
          {
            echo "### Staged \`${GITHUB_REF_NAME}\` — nothing is public yet"
            echo
            echo "Approve it with 2FA, then publish the draft Release:"
            echo
            echo '```bash'
            echo "# find the <stage-id> (needs npm >= 11.15.0 locally)"
            echo "npm stage list dsh-jev-tools"
            echo "# prompts for 2FA; npmjs.com -> Staged Packages works too"
            echo "npm stage approve <stage-id>"
            echo "gh release edit ${GITHUB_REF_NAME} --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Already public
        if: steps.published.outputs.already == 'true' && steps.published.outputs.unprovenanced != 'true'
        shell: bash
        run: |
          {
            echo "### \`${GITHUB_REF_NAME}\` is already public — nothing was staged"
            echo
            echo "npm already serves this version, so there is nothing to approve."
            echo "The draft Release below is the one thing left:"
            echo
            echo '```bash'
            echo "gh release edit ${GITHUB_REF_NAME} --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A separate job with its own permissions on purpose: creating a Release writes
  # to the repository, and the job that exchanges an OIDC token for a staging
  # grant should not also be able to write to it. Least privilege per job, not
  # per workflow.
  #
  # The Release is a **draft**, because at this point the package is staged and
  # not public: an announcement that goes out before the thing it announces is
  # the one mistake this whole flow exists to make impossible. Step 2 above
  # publishes it.
  release:
    name: draft GitHub Release
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The body is the changelog section for this version — both language sides,
      # because they are peers rather than an original and a summary. The script
      # exits non-zero when the section is missing, which is the point: an empty
      # release is worse than a red workflow, since nobody sees it fail.
      - name: Draft the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --draft \
            --notes-file release-notes.md
